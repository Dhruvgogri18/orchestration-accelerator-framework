# From project root:
#   docker compose -f docker/docker-compose.yaml up -d
# Stop:
#   docker compose -f docker/docker-compose.yaml down

services:
  pgvector:
    image: pgvector/pgvector:pg17
    container_name: oaf-pgvector
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: oaf
      POSTGRES_PASSWORD: oaf_secret
      POSTGRES_DB: oaf_vectors
    volumes:
      - oaf_pgvector_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oaf -d oaf_vectors"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  oaf_pgvector_data:
